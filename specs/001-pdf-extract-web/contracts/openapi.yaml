openapi: 3.1.0
info:
  title: WalletSeed Statement Extraction API
  version: 0.1.0
  description: |
    HTTP API for the BAC Credomatic (El Salvador) credit-card statement parser.

    This is the MVP surface for spec `001-pdf-extract-web`. It exposes a single
    endpoint that accepts one PDF, returns the extracted statement (header,
    cardholder sections, transactions, totals), and reports parse failures with
    a small, distinguishable set of error codes.

    Out of scope for this version: LLM categorization, Labels API resolution,
    persistence, authentication, multi-file uploads.

servers:
  - url: http://localhost:5080
    description: Local development

paths:
  /api/statements/extract:
    post:
      summary: Extract transactions from a BAC Credomatic statement PDF
      description: |
        Accepts a single PDF file via `multipart/form-data` (`file` field) and
        returns the parsed statement on success, or a structured error
        describing why the parse failed.

        The endpoint is stateless: uploaded bytes are not persisted past the
        request lifetime.
      operationId: extractStatement
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The PDF to parse. Max 25 MB.
      responses:
        '200':
          description: Statement parsed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedStatementResponse'
        '400':
          description: |
            Client request is malformed:
              - `INVALID_FILE_TYPE` — not a PDF (content-type or magic-byte check failed)
              - `EMPTY_FILE` — uploaded file is empty
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionErrorResponse'
        '413':
          description: |
            `FILE_TOO_LARGE` — file exceeds the 25 MB cap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionErrorResponse'
        '422':
          description: |
            Request well-formed but content cannot be processed:
              - `PASSWORD_PROTECTED` — PDF is encrypted
              - `NO_TEXT_EXTRACTABLE` — PDF has no machine-readable text (scanned/image-only)
              - `UNRECOGNIZED_LAYOUT` — not recognized as a BAC Credomatic statement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionErrorResponse'
        '500':
          description: |
            `PARSE_FAILED` — unexpected server error. Details are NOT included
            in the response; they are logged server-side only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionErrorResponse'

components:
  schemas:

    ExtractedStatementResponse:
      type: object
      required:
        - statement
        - sections
        - totals
        - reconciliationStatus
        - needsReviewCount
        - unmappedCards
      properties:
        statement:
          $ref: '#/components/schemas/StatementHeader'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/CardholderSection'
        totals:
          $ref: '#/components/schemas/StatementTotals'
        reconciliationStatus:
          $ref: '#/components/schemas/ReconciliationStatus'
        needsReviewCount:
          type: integer
          minimum: 0
        unmappedCards:
          type: array
          description: |
            Card last-4 values that the (future) label-resolution step couldn't
            map. **Always empty `[]` in this iteration** — label resolution is
            out of scope for spec 001. Retained for forward compatibility.
          items:
            type: string
            pattern: '^[0-9]{4}$'

    StatementHeader:
      type: object
      required: [cardType, maskedAccount, period, pageCount]
      properties:
        cardType:
          type: string
          example: "VISA INFINITE BLACK"
        maskedAccount:
          type: string
          example: "4593-78XX-XXXX-2145"
        period:
          $ref: '#/components/schemas/StatementPeriod'
        pageCount:
          type: integer
          minimum: 1

    StatementPeriod:
      type: object
      required: [issueDate, cutoffDate]
      properties:
        issueDate:
          type: string
          format: date
        cutoffDate:
          type: string
          format: date

    CardholderSection:
      type: object
      required:
        - cardLast4
        - rawName
        - transactions
        - totals
        - reconciliationStatus
      properties:
        cardLast4:
          type: string
          pattern: '^[0-9]{4}$'
        rawName:
          type: string
          example: "FERNANDO MAGAÑA"
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        totals:
          $ref: '#/components/schemas/SectionTotals'
        reconciliationStatus:
          $ref: '#/components/schemas/ReconciliationStatus'

    Transaction:
      type: object
      required:
        - date
        - postingDate
        - referenceNumber
        - sequenceCode
        - rowType
        - description
        - amount
        - direction
        - cardLast4
        - needsReview
        - categoryId
        - categoryName
        - labelId
        - labelName
        - labelUnmapped
      properties:
        date:
          type: string
          format: date
          description: Transaction date with year derived from statement period.
        postingDate:
          type: string
          format: date
        referenceNumber:
          type: string
          description: Preserved as string to keep leading zeros (e.g. "00000605").
        sequenceCode:
          type: string
          pattern: '^[CXP][0-9]+$'
          example: "C011"
        rowType:
          type: string
          enum: [purchase, financing, payment, adjustment]
        description:
          type: string
          description: Lightly-trimmed raw merchant description as it appears in the PDF.
        amount:
          type: number
          minimum: 0
          description: Always positive. Direction carries the sign meaning.
        direction:
          type: string
          enum: [income, expense]
          description: |
            Derived **exclusively** from which column (CARGOS vs. ABONOS) the
            amount appeared in — never from the merchant text or sequence code.
        cardLast4:
          type: string
          pattern: '^[0-9]{4}$'
        needsReview:
          type: boolean
        # --- Forward-compatibility fields, always null in this iteration ---
        categoryId:
          type: [string, "null"]
          format: uuid
          description: Always `null` in this MVP. Populated by future enrichment spec.
        categoryName:
          type: [string, "null"]
          description: Always `null` in this MVP.
        labelId:
          type: [string, "null"]
          format: uuid
          description: Always `null` in this MVP.
        labelName:
          type: [string, "null"]
          description: Always `null` in this MVP.
        labelUnmapped:
          type: boolean
          description: Always `false` in this MVP (no label resolution attempted).

    SectionTotals:
      type: object
      required: [computedCharges, computedCredits, printedCharges, printedCredits]
      properties:
        computedCharges:
          type: number
          minimum: 0
          description: Sum of `amount` where `direction == expense` in this section.
        computedCredits:
          type: number
          minimum: 0
          description: Sum of `amount` where `direction == income` in this section.
        printedCharges:
          type: [number, "null"]
          description: Value from the section's printed `SUBTOTAL.:` line, `null` if absent.
        printedCredits:
          type: [number, "null"]

    StatementTotals:
      type: object
      required: [computedExpense, computedIncome, printedExpense, printedIncome]
      properties:
        computedExpense:
          type: number
          minimum: 0
        computedIncome:
          type: number
          minimum: 0
        printedExpense:
          type: [number, "null"]
          description: From the final `TOTAL ...:` line, `null` if absent.
        printedIncome:
          type: [number, "null"]

    ReconciliationStatus:
      type: string
      enum: [ok, needsReview]

    ExtractionErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - INVALID_FILE_TYPE
                - EMPTY_FILE
                - FILE_TOO_LARGE
                - PASSWORD_PROTECTED
                - NO_TEXT_EXTRACTABLE
                - UNRECOGNIZED_LAYOUT
                - PARSE_FAILED
            message:
              type: string
              description: Human-readable, safe to display directly to the user.
